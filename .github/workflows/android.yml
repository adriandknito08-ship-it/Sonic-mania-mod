name: Build Sonic Mania Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'SonicMania/**'
      - 'dependencies/**'
      - '.github/workflows/android.yml'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Download native audio dependencies
        run: |
          set -e
          BASE="$GITHUB_WORKSPACE/dependencies/RSDKv5/dependencies/android"
          mkdir -p "$BASE"
          cd /tmp

          curl -fL \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.xz \
            -o libogg.tar.xz
          tar -xf libogg.tar.xz

          mkdir -p "$BASE/libogg"
          cp -R /tmp/libogg-1.3.5/src "$BASE/libogg/"
          mkdir -p "$BASE/libogg/include"
          cp -R /tmp/libogg-1.3.5/include/ogg \
            "$BASE/libogg/include/"

          curl -fL \
            https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.xz \
            -o libtheora.tar.xz
          tar -xf libtheora.tar.xz

          mkdir -p "$BASE/libtheora"
          cp -R /tmp/libtheora-1.1.1/lib "$BASE/libtheora/"
          cp -R /tmp/libtheora-1.1.1/include "$BASE/libtheora/"

      - name: Link game source for Android
        run: |
          JNI="$GITHUB_WORKSPACE/dependencies/RSDKv5/android/app/jni"
          mkdir -p "$JNI"
          rm -rf "$JNI/Game"
          ln -s "$GITHUB_WORKSPACE" "$JNI/Game"

      - name: Build debug APK
        run: |
          cd dependencies/RSDKv5/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonic-mania-infinite-super-apk
          path: dependencies/RSDKv5/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
